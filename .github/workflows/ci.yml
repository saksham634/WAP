name: CI Build & Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-build:
    name: Backend Build & Compile (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./WAP-Backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Normalize line endings & build with Maven
        run: |
          if [ -f "mvnw" ]; then
            sed -i 's/\r$//' mvnw
            chmod +x mvnw
            ./mvnw clean compile -DskipTests -B || mvn clean compile -DskipTests -B
          else
            mvn clean compile -DskipTests -B
          fi

  frontend-build:
    name: Frontend Build (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Build Production Bundle
        run: npm run build
