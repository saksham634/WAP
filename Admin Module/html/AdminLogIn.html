<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMS Login</title>
    <link rel="stylesheet" href="../css/AdminLogin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
<div class="container">

    <!-- Left Side -->
    <div class="left-panel">
        <div class="logo">
            <i class="fas fa-users"></i>
            <span>WMS v2.0</span>
        </div>

        <!-- Left-Content -->
        <div class="content">
            <h1>Workforce<br>Management System</h1>
            <div class="line"></div>  <!-- Decorative line -->
            <p>Manage. Empower. Excel.</p>
            
            <!-- Left-Side Features -->
            <div class="features">

                <div class="feature">
                    <i class="fas fa-shield-alt"></i>
                    <div>
                        <h3>Secure</h3>
                        <p>Role based access</p>
                    </div>
                </div>

                <div class="feature">
                    <i class="fas fa-chart-line"></i>
                    <div>
                        <h3>Smart</h3>
                        <p>AI insights</p>
                    </div>
                </div>

                <div class="feature">
                    <i class="fas fa-clock"></i>
                    <div>
                        <h3>Efficient</h3>
                        <p>Streamlined HR</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Right Side -->
    <div class="right-panel">

        <!-- Login Card -->
        <div class="login-card">
            <div class="avatar">    <!-- User Icon -->
                <i class="fas fa-user"></i>
            </div>
            <h2>Sign In &nbsp; | &nbsp; Admin</h2>
            <p class="subtitle"> Sign in to continue to your dashboard </p>

            <!-- Sign In Form -->
            <form input type="submit" method="post">
                <label>Email</label>    <!-- Email Field -->
                <div class="input-box">
                    <i class="fas fa-envelope"></i>
                    <input type="email" placeholder="Enter your email" required>
                </div>

                <label>Password</label>     <!-- Password Field -->
                <div class="input-box">
                    <i class="fas fa-lock"></i>
                    <input type="password" placeholder="Enter your password" required>
                </div>

                <div class="forgot">
                    <a href="#">Forgot Password?</a>
                </div>

                <button type="submit">Sign In</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
