# =============================================================================
# Workforce Automation Portal (WAP) - Spring Boot Configuration
# =============================================================================

# Server Port
server.port=${PORT:8080}

# Database Connection (MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/wap_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123363}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Email Notification Service (SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Security & JWT Configuration
# Access token: 15 minutes (in ms: 900000)
jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:900000}
# Refresh token: 7 days (in ms: 604800000)
jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:604800000}
jwt.secret=${JWT_SECRET:}

# CORS Configuration (Comma-separated origins)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# SpringDoc OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Rate Limiting Configuration
app.rate-limiting.auth.limit-per-minute=${AUTH_RATE_LIMIT:100}
