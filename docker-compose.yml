services:
  # =============================================================================
  # 1. MySQL 8.0 Database Service
  # =============================================================================
  mysql:
    image: mysql:8.0
    container_name: wap-mysql
    restart: unless-stopped
    command: --innodb-buffer-pool-size=64M --max-connections=50
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: wap_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - wap-net

  # =============================================================================
  # 2. Spring Boot Backend API Service
  # =============================================================================
  backend:
    build:
      context: ./WAP-Backend
      dockerfile: Dockerfile
    container_name: wap-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/wap_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      JPA_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET:-c2FrbW9kZXJuLXdvcmtmb3JjZS1hdXRvbWF0aW9uLXBvcnRhbC0yMDI2LXNlY3VyZS1rZXk=}
      JWT_ACCESS_EXPIRATION: 900000
      JWT_REFRESH_EXPIRATION: 604800000
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://frontend}
      AUTH_RATE_LIMIT: 20
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/v3/api-docs || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - wap-net

  # =============================================================================
  # 3. React Frontend SPA (Nginx Reverse Proxy)
  # =============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wap-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - wap-net

# =============================================================================
# Volumes and Networks
# =============================================================================
volumes:
  mysql_data:
    driver: local

networks:
  wap-net:
    driver: bridge
