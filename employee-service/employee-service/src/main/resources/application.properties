spring.application.name=employee-service
# 1. MySQL Connection (Notice wap_db is in the URL)
spring.datasource.url=jdbc:mysql://localhost:3306/wap_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123363

# 2. Hibernate Settings (This tells it to auto-create tables for you later)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 3. Server Port (Keeps backend on 8080 so it doesn't fight with React on 5173)
server.port=8080