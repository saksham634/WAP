<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Admin</title>
    <link rel="stylesheet" href="../../../shared/css/variables.css">
    <link rel="stylesheet" href="../../../shared/css/global.css">
    <link rel="stylesheet" href="../../../shared/css/layout.css">
    <link rel="stylesheet" href="../../../shared/css/sidebar.css">
    <link rel="stylesheet" href="../../../shared/css/header.css">
    <link rel="stylesheet" href="../../../shared/css/cards.css">
    <link rel="stylesheet" href="../../../shared/css/forms.css">
    <link rel="stylesheet" href="../styles/settings.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script src="../../../shared/js/layout-loader.js" defer></script>
    <script src="../js/settings.js" defer></script>
    <script src="../js/auth-guard.js" defer></script>
</head>
<body>
    <div class="dashboard-container">
        <div id="global-sidebar" data-sidebar="admin"></div>
        <main class="main-content">
            <header class="page-header">
                <div class="welcome-section">
                    <h1>System Settings</h1>
                    <p>Configure global platform preferences</p>
                </div>
                <div class="profile-section">
                    <div class="profile-avatar" style="background: linear-gradient(135deg, #1f2937, #4b5563);">AD</div>
                    <div class="profile-details">
                        <h3>Admin</h3>
                        <span>System Administrator</span>
                    </div>
                </div>
            </header>

            <section class="card w-100 flex-1">
                <div class="settings-grid">
                    <div class="settings-nav">
                        <button class="active" data-tab="general">General Settings</button>
                        <button data-tab="security">Security</button>
                    </div>
                    
                    <div class="settings-content" style="flex: 1;">
                        <!-- General Settings -->
                        <div id="general-tab" class="settings-form-area leave-form">
                            <div class="card-header">
                                <h2>General Configuration</h2>
                            </div>
                            <form id="generalSettingsForm">
                                <div class="form-row">
                                    <div style="flex:1;">
                                        <label>Company Name</label>
                                        <input type="text" id="companyName" required style="margin-top: 8px;">
                                    </div>
                                    <div style="flex:1;">
                                        <label>Your Email (Read-only)</label>
                                        <input type="email" id="userEmailReadOnly" readonly style="margin-top: 8px; background: #f8fafc; color: #64748b; border: 1px solid #e2e8f0;">
                                    </div>
                                </div>
                                <div class="form-row" style="margin-top: 15px;">
                                    <div style="flex:1;">
                                        <label>Timezone</label>
                                        <select id="timezoneSelect" style="margin-top: 8px;">
                                            <option value="Asia/Kolkata">Asia/Kolkata (IST)</option>
                                            <option value="America/New_York">America/New_York (EST)</option>
                                            <option value="Europe/London">Europe/London (GMT)</option>
                                            <option value="Australia/Sydney">Australia/Sydney (AEST)</option>
                                        </select>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-primary" style="width: 150px; margin-top: 25px;">Save Changes</button>
                            </form>
                        </div>

                        <!-- Security Tab -->
                        <div id="security-tab" class="settings-form-area leave-form" style="display: none;">
                            <div class="card-header">
                                <h2>Change Password</h2>
                            </div>
                            <form id="changePasswordForm">
                                <div class="form-row" style="flex-direction: column;">
                                    <div style="margin-bottom: 15px;">
                                        <label>Current Password</label>
                                        <input type="password" id="currentPassword" required style="margin-top: 8px;">
                                    </div>
                                    <div style="margin-bottom: 15px;">
                                        <label>New Password</label>
                                        <input type="password" id="newPassword" required style="margin-top: 8px;">
                                    </div>
                                    <div style="margin-bottom: 15px;">
                                        <label>Confirm New Password</label>
                                        <input type="password" id="confirmPassword" required style="margin-top: 8px;">
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-primary" style="width: 150px; margin-top: 10px;">Update Password</button>
                            </form>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
