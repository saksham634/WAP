<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - Admin</title>
    <link rel="stylesheet" href="../../../shared/css/variables.css">
    <link rel="stylesheet" href="../../../shared/css/global.css">
    <link rel="stylesheet" href="../../../shared/css/layout.css">
    <link rel="stylesheet" href="../../../shared/css/sidebar.css">
    <link rel="stylesheet" href="../../../shared/css/header.css">
    <link rel="stylesheet" href="../../../shared/css/cards.css">
    <link rel="stylesheet" href="../../../shared/css/buttons.css">
    <link rel="stylesheet" href="../../../shared/css/forms.css">
    <link rel="stylesheet" href="../styles/user-management.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script src="../../../shared/js/layout-loader.js" defer></script>
    <script src="../js/user-management.js" defer></script>
    <script src="../js/auth-guard.js" defer></script>
</head>
<body>
    <div class="dashboard-container">
        <div id="global-sidebar" data-sidebar="admin"></div>

        <main class="main-content">
            <header class="page-header">
                <div class="welcome-section">
                    <h1>User Management</h1>
                    <p>Add, edit, and manage system users</p>
                </div>
                <div class="profile-section">
                    <div class="profile-avatar" style="background: linear-gradient(135deg, #1f2937, #4b5563);">AD</div>
                    <div class="profile-details">
                        <h3>Admin</h3>
                        <span>System Administrator</span>
                    </div>
                </div>
            </header>

            <section class="card w-100 flex-1">
                <div class="card-header">
                    <div>
                        <h2>System Users</h2>
                        <p>Manage all employee and HR access accounts</p>
                    </div>
                    <button class="btn btn-primary" onclick="openModal('addUserModal')">+ Add User</button>
                </div>
                
                <div class="table-container">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Employee ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="userTableBody">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    <!-- Add User Modal (Hidden by default) -->
    <div id="addUserModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
        <div style="background: white; padding: 2rem; border-radius: 8px; width: 400px; max-width: 90%; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h2 style="margin: 0; font-size: 1.25rem;">Add New System User</h2>
                <button type="button" onclick="closeModal('addUserModal')" style="background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #64748b;">&times;</button>
            </div>

            <form id="addUserForm" style="display: flex; flex-direction: column; gap: 1rem;">
                <div>
                    <label style="font-size: 0.875rem; font-weight: 500;">Full Name</label>
                    <input type="text" id="newUserName" required style="width: 100%; padding: 0.5rem; margin-top: 0.25rem; border: 1px solid #cbd5e1; border-radius: 4px;">
                </div>
                
                <div>
                    <label style="font-size: 0.875rem; font-weight: 500;">Email Address</label>
                    <input type="email" id="newUserEmail" required style="width: 100%; padding: 0.5rem; margin-top: 0.25rem; border: 1px solid #cbd5e1; border-radius: 4px;">
                </div>

                <div>
                    <label style="font-size: 0.875rem; font-weight: 500;">Phone Number</label>
                    <input type="tel" id="newUserPhone" style="width: 100%; padding: 0.5rem; margin-top: 0.25rem; border: 1px solid #cbd5e1; border-radius: 4px;">
                </div>

                <div>
                    <label style="font-size: 0.875rem; font-weight: 500;">Assign Role</label>
                    <select id="newUserRole" required style="width: 100%; padding: 0.5rem; margin-top: 0.25rem; border: 1px solid #cbd5e1; border-radius: 4px;">
                        <option value="" disabled selected>Select Role</option>
                        <option value="ROLE_EMPLOYEE">Employee</option>
                        <option value="ROLE_HR">HR Manager</option>
                    </select>
                </div>

                <div>
                    <label style="font-size: 0.875rem; font-weight: 500;">Temporary Password</label>
                    <input type="password" id="newUserPassword" required style="width: 100%; padding: 0.5rem; margin-top: 0.25rem; border: 1px solid #cbd5e1; border-radius: 4px;">
                </div>

                <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1rem;">
                    <button type="button" onclick="closeModal('addUserModal')" style="padding: 0.5rem 1rem; background: #e2e8f0; color: #334155; border: none; border-radius: 4px; cursor: pointer;">Cancel</button>
                    <button type="submit" style="padding: 0.5rem 1rem; background: #007a7a; color: white; border: none; border-radius: 4px; cursor: pointer;">Create User</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
