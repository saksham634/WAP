<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - Workforce Platform</title>
    <link rel="stylesheet" href="../../../shared/css/variables.css">
    <link rel="stylesheet" href="../../../shared/css/global.css">
    <link rel="stylesheet" href="../../../shared/css/layout.css">
    <link rel="stylesheet" href="../../../shared/css/sidebar.css">
    <link rel="stylesheet" href="../../../shared/css/header.css">
    <link rel="stylesheet" href="../../../shared/css/cards.css">
    <link rel="stylesheet" href="../../../shared/css/buttons.css">
    <link rel="stylesheet" href="../../../shared/css/badges.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script src="../../../shared/js/layout-loader.js" defer></script>
    <script src="../js/projects.js" defer></script>
</head>
<body>
    <div class="dashboard-container">
        <!-- Global Sidebar Injected here -->
        <div id="global-sidebar" data-sidebar="employee"></div>

        <main class="main-content">
            <header class="page-header">
                <div class="welcome-section">
                    <h1>Projects & Deliverables</h1>
                    <p>Track company projects, team assignments, and progress</p>
                </div>

                <div class="profile-section">
                    <div class="profile-avatar">U</div>
                    <div class="profile-details">
                        <h3>User</h3>
                        <span>Employee</span>
                    </div>
                </div>
            </header>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <div style="display: flex; gap: 10px;">
                    <span class="badge badge-success" style="padding: 8px 16px; font-size: 13px;"><i class="fa-solid fa-bars-progress"></i> Active Deliverables</span>
                </div>
                <button id="createProjectBtn" class="btn btn-primary" style="display: none; padding: 10px 20px; background: #007a7a; color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer;">
                    <i class="fa-solid fa-plus"></i> New Project
                </button>
            </div>

            <!-- PROJECTS GRID -->
            <div id="projectsGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px;">
                <!-- Populated dynamically by JS -->
            </div>
        </main>
    </div>
</body>
</html>
