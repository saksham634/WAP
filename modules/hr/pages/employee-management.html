<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management</title>
    <link rel="stylesheet" href="../../../shared/css/variables.css">
    <link rel="stylesheet" href="../../../shared/css/global.css">
    <link rel="stylesheet" href="../../../shared/css/layout.css">
    <link rel="stylesheet" href="../../../shared/css/animations.css">
    <link rel="stylesheet" href="../../../shared/css/sidebar.css">
    <link rel="stylesheet" href="../../../shared/css/header.css">
    <link rel="stylesheet" href="../../../shared/css/cards.css">
    <link rel="stylesheet" href="../../../shared/css/buttons.css">
    <link rel="stylesheet" href="../../../shared/css/forms.css">
    <link rel="stylesheet" href="../../../shared/css/tables.css">
    <link rel="stylesheet" href="../../../shared/css/badges.css">
    <link rel="stylesheet" href="../../../shared/css/components.css">
    <link rel="stylesheet" href="../../../shared/css/utilities.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script src="../../../shared/js/layout-loader.js" defer></script>
    <script src="../js/auth-guard.js" defer></script>
</head>
<body>
    <div class="dashboard-container">
        <div id="global-sidebar" data-sidebar="hr"></div>

        <main class="main-content">
            <header class="page-header">
                <div class="welcome-section">
                    <h1>Employee Management</h1>
                    <p>View, manage, and configure employee designations.</p>
                </div>
                <div class="profile-section">
                    <div class="profile-avatar">HR</div>
                    <div class="profile-details">
                        <h3>HR Manager</h3>
                        <span>Human Resources</span>
                    </div>
                </div>
            </header>

            <div class="top-section">
                <div class="left-panel">
                    <div class="card">
                        <div class="card-header">
                            <div>
                                <h2>Active Staff Directory</h2>
                                <p id="employeeCount">Loading...</p>
                            </div>
                        </div>
                        
                        <div id="employeeList">
                            <p style="padding: 20px; color: var(--text-light);">Loading employees...</p>
                        </div>
                    </div>
                </div>

                <div class="right-panel">
                    <div class="card flex-1">
                        <div class="card-header">
                            <h2>Quick Actions</h2>
                        </div>
                        <div class="status-list">
                            <button class="filter-button w-100 justify-between" style="padding: 15px;" id="btnDeptConfig">
                                <span><i class="fa-solid fa-sitemap" style="margin-right: 8px;"></i> Department Config</span>
                                <i class="fa-solid fa-chevron-right"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Designation Assignment Modal -->
    <div id="designationModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; align-items:center; justify-content:center;">
        <div style="background:white; border-radius:16px; padding:28px 32px; width:420px; max-width:90vw; box-shadow: 0 20px 60px rgba(0,0,0,0.3);">
            <h3 style="margin:0 0 6px; font-size:18px; color:#0f172a;">Assign Designation</h3>
            <p id="designationEmpName" style="margin:0 0 18px; font-size:13px; color:#64748b;">Employee Name</p>
            
            <label style="font-size:13px; font-weight:600; color:#334155; display:block; margin-bottom:6px;">Select Designation</label>
            <select id="designationSelect" style="width:100%; padding:10px 12px; border:1px solid #e2e8f0; border-radius:10px; font-size:14px; margin-bottom:12px;">
                <option value="">-- Choose Designation --</option>
                <option value="Junior Developer">Junior Developer</option>
                <option value="Senior Developer">Senior Developer</option>
                <option value="Lead Developer">Lead Developer</option>
                <option value="Junior Tester">Junior Tester</option>
                <option value="Senior Tester">Senior Tester</option>
                <option value="QA Lead">QA Lead</option>
                <option value="DevOps Engineer">DevOps Engineer</option>
                <option value="UI/UX Designer">UI/UX Designer</option>
                <option value="Product Manager">Product Manager</option>
                <option value="Project Manager">Project Manager</option>
                <option value="Team Lead">Team Lead</option>
                <option value="Business Analyst">Business Analyst</option>
                <option value="Data Analyst">Data Analyst</option>
                <option value="Cloud Architect">Cloud Architect</option>
                <option value="HR Executive">HR Executive</option>
                <option value="Intern">Intern</option>
            </select>

            <label style="font-size:13px; font-weight:600; color:#334155; display:block; margin-bottom:6px;">Or type custom</label>
            <input type="text" id="designationCustom" placeholder="e.g., Senior Cloud Engineer" style="width:100%; padding:10px 12px; border:1px solid #e2e8f0; border-radius:10px; font-size:14px; margin-bottom:18px; box-sizing:border-box;">

            <div style="display:flex; gap:10px; justify-content:flex-end;">
                <button onclick="closeDesignationModal()" style="padding:8px 18px; border:1px solid #e2e8f0; border-radius:10px; background:white; cursor:pointer; font-size:13px;">Cancel</button>
                <button onclick="saveDesignation()" style="padding:8px 18px; border:none; border-radius:10px; background:#007a7a; color:white; cursor:pointer; font-weight:600; font-size:13px;">Save</button>
            </div>
        </div>
    </div>

    <script src="../js/employee-management.js"></script>
</body>
</html>
